{% if articles %}
<div class="grid sm:grid-cols-2 gap-4">
    {% for article in articles %}
    <article class="border rounded-lg overflow-hidden bg-white flex flex-col">
        {% if article.thumbnail_url %}
        <a href="{{ article.url }}" target="_blank" rel="noopener" class="block aspect-video bg-gray-50 overflow-hidden">
            <img src="{{ article.thumbnail_url }}" alt="{{ article.title }}" class="w-full h-full object-cover">
        </a>
        {% endif %}
        <div class="p-4 flex-1 flex flex-col">
            <div class="flex justify-between items-start gap-4 mb-1">
                <h3 class="font-medium text-sm">
                    <a href="{{ article.url }}" target="_blank" rel="noopener" class="hover:underline">
                        {{ article.title }}
                    </a>
                </h3>
                <time class="text-xs text-gray-400 shrink-0">{{ article.published_at|date:"Y.m.d" }}</time>
            </div>
            {% if article.summary %}
            <p class="text-xs text-gray-500 leading-relaxed flex-1">{{ article.summary|truncatechars:90 }}</p>
            {% endif %}
            <a href="{{ article.url }}" target="_blank" rel="noopener" class="text-xs text-blue-600 mt-3 inline-block">
                noteで読む →
            </a>
        </div>
    </article>
    {% endfor %}
</div>
{% else %}
<p class="text-sm text-gray-400">まだ記事がありません。</p>
{% endif %}
