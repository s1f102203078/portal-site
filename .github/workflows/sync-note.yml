name: Sync Note Articles

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = JST 6:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch RSS and push to webhook
        env:
          NOTE_RSS_URL: ${{ secrets.NOTE_RSS_URL }}
          SYNC_ENDPOINT_URL: ${{ secrets.SYNC_ENDPOINT_URL }}
          SYNC_SECRET_TOKEN: ${{ secrets.SYNC_SECRET_TOKEN }}
        run: python scripts/fetch_and_push_note.py
